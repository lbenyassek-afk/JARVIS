name: Build JARVIS V8 Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "JARVIS-V8/**"
      - ".github/workflows/build-jarvis-v8.yml"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: JARVIS-V8/requirements.txt

      - name: Install Python dependencies
        working-directory: JARVIS-V8
        run: python -m pip install -r requirements.txt

      - name: Test V8
        working-directory: JARVIS-V8
        run: python -m unittest discover -s tests -v

      - name: Run offline reliability benchmark
        working-directory: JARVIS-V8
        run: python benchmark.py

      - name: Validate installed dependencies
        working-directory: JARVIS-V8
        run: python -m pip check

      - name: Build the windowed application
        working-directory: JARVIS-V8
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed `
            --name "JARVIS V8" --icon jarvis.ico --version-file version_info.txt `
            --add-data "core/prompt.txt;core" --add-data "core/manager_prompt.txt;core" `
            --add-data "jarvis.ico;." --add-data "skills;skills" `
            --hidden-import PyQt6.QtTextToSpeech --hidden-import PyQt6.QtMultimedia `
            --collect-all edge_tts --collect-all speech_recognition --collect-all pocketsphinx `
            --collect-all sounddevice --hidden-import numpy `
            --hidden-import pyautogui --hidden-import pyperclip --collect-all pynput `
            --collect-all keyring main.py

      - name: Build normal Windows setup wizard
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "JARVIS-V8\installer.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V8-Windows-Setup
          path: JARVIS-V8/release/JARVIS-V8-Setup.exe
          if-no-files-found: error

      - name: Publish latest installer release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v8.0.0-alpha.1 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete v8.0.0-alpha.1 --cleanup-tag --yes
          }
          gh release create v8.0.0-alpha.1 `
            "JARVIS-V8/release/JARVIS-V8-Setup.exe" `
            --target "$env:GITHUB_SHA" `
            --title "JARVIS V8 Alpha 1 — Independent identity and Screen Guide" `
            --prerelease `
            --notes "Created by Reda Benyassek. First private V8 build on the V7 foundation. Not a stable release."
